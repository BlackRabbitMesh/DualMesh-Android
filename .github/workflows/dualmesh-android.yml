name: DualMesh Android APK

on:
  workflow_dispatch:
  push:
    branches: [dual-radio-rebuild]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Fetch dependencies
        run: flutter pub get
      - name: Generate model adapters
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Check dual-radio source
        run: |
          dart format --output=none --set-exit-if-changed lib/models/dual_radio_slot.dart lib/services/dual_radio/dual_radio_registry.dart test/services/dual_radio_registry_test.dart
          flutter test test/services/dual_radio_registry_test.dart
      - name: Compile Android debug APK
        run: flutter build apk --debug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dualmesh-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
