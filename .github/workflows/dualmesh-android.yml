name: DualMesh Android APK

on:
  workflow_dispatch:
  push:
    branches: [dual-radio-rebuild]

permissions:
  contents: read

# Prevent two builds from generating competing first-run signing keys.
concurrency:
  group: dualmesh-android-signing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Use Java 21 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Fetch dependencies
        run: flutter pub get
      - name: Generate model adapters
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Check dual-radio source
        run: |
          dart format lib/models/dual_radio_slot.dart lib/services/dual_radio/dual_radio_registry.dart test/services/dual_radio_registry_test.dart
          flutter test test/services/dual_radio_registry_test.dart
      # Keep the Android debug signing identity across GitHub-hosted runners.
      # The first build creates the keystore; subsequent builds restore it.
      # If this cache is ever evicted, updates may require reinstalling.
      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: dualmesh-android-debug-signing-v1
      - name: Ensure stable Android debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US' -noprompt
          fi
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey | grep -E 'SHA256:|Alias name:'
      - name: Compile Android debug APK
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          flutter build apk --debug --build-number="${{ github.run_number }}"
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dualmesh-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
